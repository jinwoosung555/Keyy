<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ken Hub - Key System</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .background {
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at 50% 20%, #1a1a1a 0%, transparent 35%),
            radial-gradient(circle at 20% 80%, #111 0%, transparent 30%),
            #000;
        z-index: -1;
    }

    .container {
        width: min(92%, 430px);
        background: #080808;
        border: 1px solid #222;
        border-radius: 20px;
        padding: 30px 25px;
        box-shadow:
            0 0 40px rgba(255,255,255,0.03),
            0 20px 60px rgba(0,0,0,0.8);
    }

    .logo {
        width: 65px;
        height: 65px;
        margin: 0 auto 18px;
        border-radius: 18px;
        background: #000;
        border: 1px solid #333;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -2px;
        box-shadow: 0 0 25px rgba(255,255,255,0.04);
    }

    h1 {
        text-align: center;
        font-size: 27px;
        font-weight: 800;
        letter-spacing: -0.5px;
    }

    .subtitle {
        text-align: center;
        color: #888;
        font-size: 14px;
        margin-top: 8px;
        line-height: 1.5;
    }

    .key-box {
        margin-top: 25px;
        background: #050505;
        border: 1px solid #222;
        border-radius: 14px;
        padding: 15px;
    }

    .label {
        color: #777;
        font-size: 12px;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .key-row {
        display: flex;
        gap: 8px;
    }

    #keyDisplay {
        flex: 1;
        min-width: 0;
        height: 48px;
        background: #0d0d0d;
        border: 1px solid #242424;
        border-radius: 10px;
        color: #fff;
        padding: 0 13px;
        outline: none;
        font-size: 13px;
    }

    .copy-btn {
        width: 75px;
        border: 1px solid #333;
        border-radius: 10px;
        background: #111;
        color: #fff;
        cursor: pointer;
        transition: .2s;
    }

    .copy-btn:hover {
        background: #1c1c1c;
    }

    .generate-btn {
        width: 100%;
        height: 52px;
        margin-top: 15px;
        border: 1px solid #333;
        border-radius: 11px;
        background: #000;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: .2s;
    }

    .generate-btn:hover:not(:disabled) {
        background: #151515;
        border-color: #555;
        transform: translateY(-1px);
    }

    /* Locked state */
    .generate-btn:disabled {
        background: #000;
        color: #444;
        border-color: #111;
        cursor: not-allowed;
        opacity: 1;
    }

    .timer {
        margin-top: 18px;
        padding: 14px;
        background: #050505;
        border: 1px solid #1d1d1d;
        border-radius: 12px;
        text-align: center;
    }

    .timer-title {
        color: #777;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    #countdown {
        margin-top: 5px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    .status {
        text-align: center;
        font-size: 12px;
        margin-top: 12px;
        color: #666;
    }

    .status.active {
        color: #aaa;
    }

    .status.expired {
        color: #fff;
    }

    .footer {
        margin-top: 22px;
        text-align: center;
        color: #444;
        font-size: 11px;
    }

    @media (max-width: 400px) {
        .container {
            padding: 25px 18px;
        }

        h1 {
            font-size: 24px;
        }
    }
</style>
</head>

<body>

<div class="background"></div>

<main class="container">

    <div class="logo">KH</div>

    <h1>Ken Hub</h1>

    <p class="subtitle">
        Generate your 24-hour access key.
        <br>
        You can regenerate after the current key expires.
    </p>

    <div class="key-box">

        <div class="label">Your Key</div>

        <div class="key-row">
            <input
                id="keyDisplay"
                type="text"
                readonly
                placeholder="No key generated"
            >

            <button class="copy-btn" id="copyBtn">
                Copy
            </button>
        </div>

        <button class="generate-btn" id="generateBtn">
            Generate 24H Key
        </button>

    </div>

    <div class="timer">
        <div class="timer-title">Key expires in</div>
        <div id="countdown">--:--:--</div>
    </div>

    <div class="status" id="status">
        No active key
    </div>

    <div class="footer">
        Ken Hub • 24 Hour Key System
    </div>

</main>

<script>
/* ==========================================
   KEN HUB 24-HOUR KEY SYSTEM
   ========================================== */

const KEY_STORAGE = "kenhub_24h_key";
const EXPIRY_STORAGE = "kenhub_24h_expiry";

const generateBtn = document.getElementById("generateBtn");
const copyBtn = document.getElementById("copyBtn");
const keyDisplay = document.getElementById("keyDisplay");
const countdown = document.getElementById("countdown");
const statusText = document.getElementById("status");

const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;

let timer = null;


/* ------------------------------------------
   Generate random key
   ------------------------------------------ */

function generateKey() {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
        "abcdefghijklmnopqrstuvwxyz" +
        "0123456789";

    let randomPart = "";

    for (let i = 0; i < 20; i++) {
        randomPart += characters.charAt(
            Math.floor(Math.random() * characters.length)
        );
    }

    return "KENHUB-" + randomPart;
}


/* ------------------------------------------
   Generate new 24-hour key
   ------------------------------------------ */

function createKey() {

    const existingExpiry =
        Number(localStorage.getItem(EXPIRY_STORAGE));

    /*
        Don't allow regeneration while an existing
        key is still active.
    */
    if (
        existingExpiry &&
        Date.now() < existingExpiry
    ) {
        return;
    }

    const key = generateKey();
    const expiry = Date.now() + TWENTY_FOUR_HOURS;

    localStorage.setItem(KEY_STORAGE, key);
    localStorage.setItem(EXPIRY_STORAGE, expiry);

    keyDisplay.value = key;

    startTimer(expiry);
}


/* ------------------------------------------
   Start countdown
   ------------------------------------------ */

function startTimer(expiry) {

    clearInterval(timer);

    generateBtn.disabled = true;

    statusText.textContent = "Key active — regeneration locked";
    statusText.className = "status active";

    updateCountdown(expiry);

    timer = setInterval(() => {

        updateCountdown(expiry);

    }, 1000);
}


/* ------------------------------------------
   Update countdown
   ------------------------------------------ */

function updateCountdown(expiry) {

    const remaining = expiry - Date.now();

    if (remaining <= 0) {

        clearInterval(timer);

        countdown.textContent = "00:00:00";

        generateBtn.disabled = false;

        statusText.textContent =
            "Key expired — you can generate a new key";

        statusText.className = "status expired";

        /*
            Remove expired key.
        */
        localStorage.removeItem(KEY_STORAGE);
        localStorage.removeItem(EXPIRY_STORAGE);

        keyDisplay.value = "";

        return;
    }

    const totalSeconds =
        Math.floor(remaining / 1000);

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor((totalSeconds % 3600) / 60);

    const seconds =
        totalSeconds % 60;

    countdown.textContent =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
}


/* ------------------------------------------
   Copy key
   ------------------------------------------ */

copyBtn.addEventListener("click", async () => {

    const key = keyDisplay.value;

    if (!key) {
        return;
    }

    try {

        await navigator.clipboard.writeText(key);

        copyBtn.textContent = "Copied!";

        setTimeout(() => {
            copyBtn.textContent = "Copy";
        }, 1500);

    } catch {

        keyDisplay.select();
        document.execCommand("copy");

        copyBtn.textContent = "Copied!";

        setTimeout(() => {
            copyBtn.textContent = "Copy";
        }, 1500);
    }
});


/* ------------------------------------------
   Generate button
   ------------------------------------------ */

generateBtn.addEventListener("click", () => {

    if (generateBtn.disabled) {
        return;
    }

    createKey();
});


/* ------------------------------------------
   Restore key after page refresh
   ------------------------------------------ */

function restoreKey() {

    const savedKey =
        localStorage.getItem(KEY_STORAGE);

    const savedExpiry =
        Number(localStorage.getItem(EXPIRY_STORAGE));

    if (
        savedKey &&
        savedExpiry &&
        Date.now() < savedExpiry
    ) {

        keyDisplay.value = savedKey;

        startTimer(savedExpiry);

        return;
    }

    /*
        No active key or previous key expired.
    */

    localStorage.removeItem(KEY_STORAGE);
    localStorage.removeItem(EXPIRY_STORAGE);

    generateBtn.disabled = false;

    countdown.textContent = "00:00:00";

    statusText.textContent =
        "No active key";

    statusText.className = "status";
}


/* ------------------------------------------
   Start system
   ------------------------------------------ */

restoreKey();

</script>

</body>
    </html>
